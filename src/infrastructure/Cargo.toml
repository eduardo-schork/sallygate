[package]
name = "sallygate-infrastructure"
description = "Sallygate infrastructure layer: adapters that implement the application ports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sallygate-domain.workspace = true
sallygate-application.workspace = true
async-trait = "0.1"
russh = "0.65"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
