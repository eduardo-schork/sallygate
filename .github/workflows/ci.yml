# Runs the same checks as `bun run check:full` on every push to develop, every pull request, and
# before every release (ADR-0021, ADR-0023). No secrets are used here. Actions are pinned to commit
# SHAs.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  # The Release workflow runs these checks before it builds, so pushes to main are covered there.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Tauri compiles against the system webview, even for lint and unit tests.
      - name: Install Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # rust-toolchain.toml picks the toolchain and its clippy and rustfmt.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: bun install --frozen-lockfile

      - name: Start the SSH test server
        run: scripts/test-ssh-server.sh up

      - run: bun run check:full

      # Contract tests regenerate the TypeScript types; a diff means they were not committed.
      - name: Check that generated contracts are committed
        run: git diff --exit-code -- src/presentation/ui
