# Automatic release on every push to main (ADR-0023), like refined-redmine.
# A push with a feat or fix commit since the last release becomes a new version: the version comes
# from the commits, "## Next version" in CHANGELOG.md becomes that version, the macOS app is built,
# and the release commit, tag and GitHub Release are published. Docs, chore and ci pushes release
# nothing. Only the publish and sync jobs can write to the repository. Actions are pinned to commit
# SHAs, so a moved tag cannot change what runs next to the signing key.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: node scripts/ci/release-plan.mjs plan

  check:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [plan, check]
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # One app for Apple silicon and Intel Macs.
      - name: Install Rust for both Mac architectures
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: bun install --frozen-lockfile

      # The app carries its version, so it is written before the build.
      - run: node scripts/ci/release-plan.mjs apply "$VERSION"

      # The update package is signed with the updater key (ADR-0024), so installed apps accept it.
      # shortcut: the app is not signed or notarized by Apple, so macOS asks before opening it the
      # first time; add Apple signing secrets here once there is a Developer ID.
      - run: bun run tauri build --target universal-apple-darwin --bundles app,dmg
        # Only this step sees the key; it stays in GitHub secrets and never reaches the logs.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-app
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/Sallygate.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/Sallygate.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-app
          path: dist

      - run: node scripts/ci/release-plan.mjs apply "$VERSION"

      - name: Commit and tag the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock package.json CHANGELOG.md
          git commit -m "chore: release $VERSION"
          git tag "v$VERSION"
          # Atomic: if main moved during the build, nothing is pushed and nothing is released.
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

      # latest.json is what installed apps read to find this version (ADR-0024).
      - name: Publish the release
        run: |
          node scripts/ci/release-plan.mjs notes "$VERSION" > notes.md
          node scripts/ci/release-plan.mjs updater-manifest "$VERSION" dist/macos/Sallygate.app.tar.gz.sig > dist/latest.json
          # The artifact keeps the bundle folders: dist/dmg and dist/macos.
          gh release create "v$VERSION" dist/dmg/*.dmg dist/macos/Sallygate.app.tar.gz dist/latest.json \
            --title "Sallygate $VERSION" --notes-file notes.md

  # Brings the release commit (version and renamed CHANGELOG section) back to develop.
  sync-develop:
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge main into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Usual case: develop has nothing beyond what was released, so it just moves forward.
          if git merge --ff-only origin/main; then
            git push origin HEAD:develop
            echo "develop moved forward to v$VERSION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git merge --no-ff -m "chore: merge main into develop after v$VERSION" origin/main; then
            git push origin HEAD:develop
            echo "main merged into develop after v$VERSION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git merge --abort
          {
            echo "### develop was not updated"
            echo "v$VERSION was published, but merging main into develop has conflicts (usually CHANGELOG.md)."
            echo "Run \`git checkout develop && git merge main\`, solve the conflicts and push develop."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Conflicts merging main into develop; see the job summary."
          exit 1
